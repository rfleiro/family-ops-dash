<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mates">
<meta name="robots" content="noindex, nofollow">
<title>Hojas de mates</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fbfaf4'/><circle cx='50' cy='27' r='7' fill='%231f8a4c'/><circle cx='50' cy='73' r='7' fill='%231f8a4c'/><path d='M26 50h48' stroke='%231f8a4c' stroke-width='10' stroke-linecap='round'/></svg>">
<script>(function(){try{var t=localStorage.getItem('dash:theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);}catch(e){}})()</script>
<style>
:root{
  --paper:#fbfaf4; --grid:rgba(60,110,190,.14); --ink:#1b2a41; --muted:#69738a;
  --blue:#1f4fd1; --blue-soft:rgba(31,79,209,.10); --red:#d6403b; --ok:#1f8a4c; --bad:#c9302c;
  --card:#ffffff; --line:#d9d6c8; --chip:#efecdf; --chip-on:#1b2a41; --chip-on-ink:#fbfaf4;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(27,42,65,.35);
  --num:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;
  --txt:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121a26; --grid:rgba(140,180,255,.09); --ink:#e8edf6; --muted:#97a2b8;
    --blue:#8fb0ff; --blue-soft:rgba(143,176,255,.14); --red:#ff7a72; --ok:#5fd08a; --bad:#ff8a84;
    --card:#1a2434; --line:#2d3950; --chip:#223049; --chip-on:#e8edf6; --chip-on-ink:#121a26; --shadow:0 6px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#121a26; --grid:rgba(140,180,255,.09); --ink:#e8edf6; --muted:#97a2b8;
  --blue:#8fb0ff; --blue-soft:rgba(143,176,255,.14); --red:#ff7a72; --ok:#5fd08a; --bad:#ff8a84;
  --card:#1a2434; --line:#2d3950; --chip:#223049; --chip-on:#e8edf6; --chip-on-ink:#121a26; --shadow:0 6px 18px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; color:var(--ink); font:16px/1.45 var(--txt); min-height:100vh;
}
.app{max-width:820px;margin:0 auto;padding:14px 16px 40px 44px;position:relative;min-height:100vh}
.app::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
@media (max-width:520px){.app{padding-left:36px;padding-right:12px}.app::before{left:20px}}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.back{color:var(--muted);text-decoration:none;font-size:14px;padding:4px 8px;margin-left:-8px;border-radius:8px}
.back:hover{background:var(--chip);color:var(--ink)}
h1{font:800 clamp(22px,5vw,30px)/1.1 var(--num);letter-spacing:-.01em;margin:0;flex:1 1 auto}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
button{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font:700 16px/1.2 var(--num);margin:0 0 10px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);min-width:52px;height:52px;border-radius:12px;font:800 26px var(--num);cursor:pointer;display:grid;place-items:center;padding:0 10px}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.label{font-size:13px;color:var(--muted);margin-right:6px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:transparent}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
[hidden]{display:none!important}

/* ── hoja (siempre "papel": fondo blanco y tinta oscura, también en modo oscuro) ── */
.sheet{background:#fff;color:#1b2a41;border:1px solid var(--line);border-radius:6px;padding:18px 18px 22px;box-shadow:var(--shadow)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid #1b2a41;padding-bottom:6px;margin-bottom:10px}
.sh b{font:800 20px var(--num)}
.sh span{font-size:12px;color:#69738a}
.nm{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#69738a;margin-bottom:14px}
.nm i{display:inline-block;width:110px;border-bottom:1px solid #99a1b3;margin-left:4px}
.nm i.s{width:34px}
.grid{display:grid;gap:8px 14px}
.g-line{grid-template-columns:repeat(3,1fr)}
.g-line2{grid-template-columns:repeat(2,1fr)}
.g-col4{grid-template-columns:repeat(4,1fr)}
.g-col5{grid-template-columns:repeat(5,1fr)}
@media screen and (max-width:640px){.g-line,.g-line2,.g-col4,.g-col5{grid-template-columns:repeat(2,1fr)}}
.cell{position:relative;padding:6px 2px 6px 22px;min-height:46px;display:flex;align-items:center}
.cell .n{position:absolute;left:0;top:7px;font-size:11px;color:#9aa3b5}
.g-col4 .cell,.g-col5 .cell{align-items:flex-start;justify-content:center;padding-left:18px;min-height:130px}
.eq{font:700 clamp(15px,3.4vw,21px) var(--num);white-space:nowrap;font-variant-numeric:tabular-nums}
.eq .o{color:#d6403b;padding:0 .1em}
.bl{display:inline-block;min-width:3.4ch;border-bottom:2px solid #9aa3b5;text-align:center;color:transparent;margin-left:.25em}
.v{display:inline-block;font:700 clamp(16px,3.8vw,22px) var(--num);font-variant-numeric:tabular-nums}
.vr{text-align:right;position:relative;line-height:1.5;padding-left:1.3em}
.vr .o{position:absolute;left:0;color:#d6403b}
.vr.ln{border-bottom:2px solid #1b2a41;padding-bottom:2px;margin-bottom:2px}
.vans{text-align:right;min-height:1.8em;color:transparent}
.dv{display:grid;grid-template-columns:auto auto;font:700 clamp(16px,3.8vw,22px) var(--num);font-variant-numeric:tabular-nums}
.dd{grid-row:1/3;text-align:right;padding:0 .5em 1.6em 0;border-right:2px solid #1b2a41;min-width:2ch}
.ds{padding:0 .8em 0 .5em;border-bottom:2px solid #1b2a41;min-width:2.6ch}
.dq{padding:.2em .5em;min-height:1.8em;color:transparent}
.sheet.sol .bl,.sheet.sol .vans,.sheet.sol .dq{color:#1f4fd1}
.sheet.sol .bl{border-color:#1f4fd1}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}

@media print{
  @page{size:A4;margin:12mm}
  html{padding:0}
  body{background:#fff!important;color:#000}
  .app{padding:0;max-width:none;min-height:0}
  .app::before{display:none}
  .noprint{display:none!important}
  .sheet{border:0;box-shadow:none;padding:0;border-radius:0}
  .grid{gap:0 8mm}
  .g-line{grid-template-columns:repeat(3,1fr)!important}
  .g-line2{grid-template-columns:repeat(2,1fr)!important}
  .g-col4{grid-template-columns:repeat(4,1fr)!important}
  .g-col5{grid-template-columns:repeat(5,1fr)!important}
  .g-line .cell,.g-line2 .cell{height:21mm;min-height:0}
  .g-col4 .cell,.g-col5 .cell{height:40mm;min-height:0}
  .eq{font-size:15pt}
  .v,.dv{font-size:16pt}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="noprint">
    <a class="back" href="../">‹ dashboards</a>
    <h1>Hojas de mates</h1>
    <button class="theme" id="themeBtn" aria-label="Cambiar tema" title="Tema">◐</button>
  </header>

  <div class="card noprint">
    <h2>Operaciones</h2>
    <div class="chips" id="ops">
      <button class="chip" data-op="+" aria-pressed="true" aria-label="Sumas">+</button>
      <button class="chip" data-op="-" aria-pressed="true" aria-label="Restas">−</button>
      <button class="chip" data-op="*" aria-pressed="false" aria-label="Multiplicaciones">×</button>
      <button class="chip" data-op="/" aria-pressed="false" aria-label="Divisiones">÷</button>
    </div>

    <div class="row">
      <span class="label">Dificultad</span>
      <div class="seg" data-seg="level">
        <button data-v="1">Fácil</button><button data-v="2">Medio</button><button data-v="3">Difícil</button><button data-v="4">Reto</button>
      </div>
    </div>
    <p class="hint" id="lvHint"></p>

    <div class="row">
      <span class="label">Ejercicios</span>
      <div class="seg" data-seg="n"><button data-v="12">12</button><button data-v="20">20</button><button data-v="30">30</button></div>
      <span class="label">Formato</span>
      <div class="seg" data-seg="fmt"><button data-v="line">En línea</button><button data-v="col">En columna</button></div>
    </div>

    <div class="row" id="carryRow">
      <span class="label">Llevadas (sumas y restas)</span>
      <div class="seg" data-seg="carry"><button data-v="any">Da igual</button><button data-v="no">Sin llevadas</button><button data-v="yes">Con llevadas</button></div>
    </div>
  </div>

  <div class="actions noprint">
    <button class="btn primary" id="newBtn">↻ Nueva hoja</button>
    <button class="btn" id="pdfBtn">⬇ PDF para imprimir</button>
    <button class="btn" id="pdfSolBtn">⬇ PDF con soluciones</button>
    <button class="btn ghost" id="printBtn">🖨 Imprimir</button>
    <label class="tog"><input type="checkbox" id="solChk"> Ver soluciones</label>
  </div>

  <div class="sheet" id="sheet"></div>
  <p class="foot noprint">Las divisiones son siempre exactas. El PDF es una sola hoja A4 y se genera con los mismos ejercicios que ves en pantalla.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
var SYM={'+':'+','-':'\u2212','*':'\u00D7','/':'\u00F7'};
var OPNAME={'+':'sumas','-':'restas','*':'multiplicaciones','/':'divisiones'};
var LVNAME=['','F\u00E1cil','Medio','Dif\u00EDcil','Reto'];
var LVTXT=[
 '',
 'Sumas y restas hasta 20 \u00B7 tablas del 2 al 5 \u00B7 divisor de 2 a 5',
 'Sumas y restas de 2 cifras \u00B7 tablas del 2 al 10 \u00B7 divisor de 2 a 10',
 'Sumas y restas de 3 cifras \u00B7 2 cifras \u00D7 1 cifra \u00B7 divisor de 1 cifra, cociente de 2 cifras',
 'Sumas y restas de 4 cifras \u00B7 2 cifras \u00D7 2 cifras \u00B7 divisor de 2 cifras, cociente de 2 cifras'
];

/* ─── preferencias (nada sensible: solo ajustes de la hoja) ─── */
var P={ops:['+','-'],level:2,n:20,fmt:'line',carry:'any'};
try{var sv=JSON.parse(localStorage.getItem('mates:prefs')||'null');if(sv){for(var k in P)if(sv[k]!==undefined)P[k]=sv[k];}}catch(e){}
function savePrefs(){try{localStorage.setItem('mates:prefs',JSON.stringify(P))}catch(e){}}

var items=[];

/* ─── generación ─── */
function carryAdd(a,b){while(a>0||b>0){if(a%10+b%10>=10)return true;a=Math.floor(a/10);b=Math.floor(b/10)}return false}
function borrow(a,b){while(a>0||b>0){if(a%10<b%10)return true;a=Math.floor(a/10);b=Math.floor(b/10)}return false}
function one(op,l){
  var a,b,lo,hi;
  if(op==='+'){
    if(l===1){a=R(1,15);b=R(1,20-a)}
    else{lo=l===2?10:l===3?100:1000;hi=lo*10-1;a=R(lo,hi);b=R(lo,hi)}
    return {op:op,a:a,b:b,r:a+b};
  }
  if(op==='-'){
    if(l===1){a=R(5,20);b=R(1,a)}
    else{lo=l===2?10:l===3?100:1000;hi=lo*10-1;a=R(lo*2,hi);b=R(lo,a)}
    return {op:op,a:a,b:b,r:a-b};
  }
  if(op==='*'){
    if(l===1){a=R(2,5);b=R(1,10)}
    else if(l===2){a=R(2,10);b=R(2,10)}
    else if(l===3){a=R(10,99);b=R(2,9)}
    else{a=R(11,99);b=R(11,99)}
    if(Math.random()<.5&&l<3){var t=a;a=b;b=t}
    return {op:op,a:a,b:b,r:a*b};
  }
  var d,q;
  if(l===1){d=R(2,5);q=R(1,10)}
  else if(l===2){d=R(2,10);q=R(2,12)}
  else if(l===3){d=R(2,9);q=R(10,99)}
  else{d=R(12,49);q=R(10,99)}
  return {op:op,a:d*q,b:d,r:q};
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function make(){
  var seq=[];
  for(var i=0;i<P.n;i++)seq.push(P.ops[i%P.ops.length]);
  shuffle(seq);
  var seen={},out=[];
  seq.forEach(function(op){
    var it,t=0,ok;
    do{
      it=one(op,P.level);t++;
      ok=!seen[op+it.a+'_'+it.b];
      if(ok&&P.carry!=='any'&&(op==='+'||op==='-')){
        var c=op==='+'?carryAdd(it.a,it.b):borrow(it.a,it.b);
        ok=((P.carry==='yes')===c);
      }
    }while(!ok&&t<400);
    seen[op+it.a+'_'+it.b]=1;
    out.push(it);
  });
  items=out;
}

/* ─── pantalla ─── */
function opsLabel(){return P.ops.map(function(o){return OPNAME[o]}).join(', ')}
function render(){
  var cols=P.fmt==='line'?(P.level===4?'g-line2':'g-line'):(P.n>20?'g-col5':'g-col4');
  var h='<div class="sh"><b>Hoja de mates</b><span>'+LVNAME[P.level]+' \u00B7 '+opsLabel()+'</span></div>'
    +'<div class="nm"><span>Nombre:<i></i></span><span>Fecha:<i class="s"></i></span><span>Aciertos:<i class="s"></i> / '+items.length+'</span></div>'
    +'<div class="grid '+cols+'">';
  items.forEach(function(it,i){
    h+='<div class="cell"><span class="n">'+(i+1)+')</span>';
    if(P.fmt==='line'){
      h+='<span class="eq">'+it.a+' <span class="o">'+SYM[it.op]+'</span> '+it.b+' =<span class="bl">'+it.r+'</span></span>';
    }else if(it.op==='/'){
      h+='<div class="dv"><div class="dd">'+it.a+'</div><div class="ds">'+it.b+'</div><div class="dq">'+it.r+'</div></div>';
    }else{
      var top=it.a,bot=it.b;
      if(it.op==='*'&&top<bot){top=it.b;bot=it.a}
      h+='<div class="v"><div class="vr">'+top+'</div><div class="vr ln"><span class="o">'+SYM[it.op]+'</span>'+bot+'</div><div class="vans">'+it.r+'</div></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  $('#sheet').innerHTML=h;
  $('#sheet').classList.toggle('sol',$('#solChk').checked);
}
function syncUI(){
  document.querySelectorAll('#ops .chip').forEach(function(b){b.setAttribute('aria-pressed',P.ops.indexOf(b.dataset.op)>=0)});
  document.querySelectorAll('[data-seg]').forEach(function(sg){
    var k=sg.dataset.seg;
    sg.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(P[k])===b.dataset.v)});
  });
  $('#lvHint').textContent=LVTXT[P.level];
  $('#carryRow').hidden=!(P.ops.indexOf('+')>=0||P.ops.indexOf('-')>=0);
}
function refresh(){savePrefs();syncUI();make();render()}

document.querySelectorAll('#ops .chip').forEach(function(b){
  b.onclick=function(){
    var o=b.dataset.op,i=P.ops.indexOf(o);
    if(i>=0){if(P.ops.length>1)P.ops.splice(i,1)}else{P.ops.push(o);P.ops.sort(function(x,y){return '+-*/'.indexOf(x)-'+-*/'.indexOf(y)})}
    refresh();
  };
});
document.querySelectorAll('[data-seg]').forEach(function(sg){
  sg.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      var k=sg.dataset.seg,v=b.dataset.v;
      P[k]=(k==='level'||k==='n')?parseInt(v,10):v;
      refresh();
    };
  });
});
$('#newBtn').onclick=function(){make();render()};
$('#solChk').onchange=function(){$('#sheet').classList.toggle('sol',this.checked)};
$('#printBtn').onclick=function(){window.print()};

/* ─── PDF (1 página A4) ─── */
function drawOp(doc,op,x,y,ink){
  if(op==='-'){doc.setDrawColor(ink[0],ink[1],ink[2]);doc.setLineWidth(.55);doc.line(x+.3,y-1.8,x+3.4,y-1.8)}
  else doc.text(op==='*'?'\u00D7':op==='/'?'\u00F7':'+',x,y);
}
function pdf(withSol){
  if(!window.jspdf){alert('No se pudo cargar la librer\u00EDa de PDF (\u00BFsin conexi\u00F3n?). Usa "Imprimir" y elige "Guardar como PDF".');return}
  var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var W=210,H=297,M=14,INK=[27,42,65],BLUE=[31,79,209],GRY=[140,148,162],RED=[214,64,59];
  var ink=function(){doc.setTextColor(INK[0],INK[1],INK[2])};
  var sw=function(s){return doc.getTextWidth(String(s))};

  // cabecera
  ink();doc.setFont('helvetica','bold');doc.setFontSize(18);
  doc.text(withSol?'Hoja de mates - soluciones':'Hoja de mates',M,M+6);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(105,115,138);
  doc.text(LVNAME[P.level]+'  |  '+opsLabel(),W-M,M+6,{align:'right'});
  doc.setDrawColor(INK[0],INK[1],INK[2]);doc.setLineWidth(.5);doc.line(M,M+9,W-M,M+9);
  if(!withSol){
    doc.setFontSize(10);doc.setTextColor(105,115,138);doc.setDrawColor(GRY[0],GRY[1],GRY[2]);doc.setLineWidth(.25);
    var yl=M+19;
    doc.text('Nombre:',M,yl);doc.line(M+16,yl+1,M+88,yl+1);
    doc.text('Fecha:',M+96,yl);doc.line(M+109,yl+1,M+138,yl+1);
    doc.text('Aciertos:',M+146,yl);doc.line(M+161,yl+1,M+171,yl+1);doc.text('/ '+items.length,M+173,yl);
  }

  // cuadr\u00EDcula
  var y0=M+27,yb=H-M-2,avail=yb-y0;
  var line=P.fmt==='line';
  var cols=line?(P.level===4?2:3):(P.n>20?5:4);
  var rows=Math.ceil(items.length/cols);
  var cw=(W-2*M)/cols;
  var rh=Math.min(avail/rows,line?24:44);

  items.forEach(function(it,i){
    var x=M+(i%cols)*cw,y=y0+Math.floor(i/cols)*rh;
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(GRY[0],GRY[1],GRY[2]);
    doc.text((i+1)+')',x,y+(line?rh/2+2:5));
    ink();
    if(line){
      doc.setFontSize(14);doc.setFont('helvetica','bold');
      var x0=x+7,yy=y+rh/2+2;
      doc.text(String(it.a),x0,yy);x0+=sw(it.a)+2.5;
      doc.setTextColor(RED[0],RED[1],RED[2]);drawOp(doc,it.op,x0,yy,RED);ink();x0+=6;
      doc.text(String(it.b),x0,yy);x0+=sw(it.b)+2.5;
      doc.text('=',x0,yy);x0+=6;
      var xe=x+cw-5;
      doc.setDrawColor(GRY[0],GRY[1],GRY[2]);doc.setLineWidth(.3);doc.line(x0,yy+1,xe,yy+1);
      if(withSol){doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]);doc.text(String(it.r),x0+1.5,yy-.2);ink()}
    }else if(it.op==='/'){
      doc.setFontSize(16);doc.setFont('helvetica','bold');
      var sd=String(it.a),sv=String(it.b),wd=sw(sd),wv=sw(sv);
      var xl=x+8,xs=xl+wd+3;
      doc.text(sd,xl+wd,y+12,{align:'right'});
      doc.setDrawColor(INK[0],INK[1],INK[2]);doc.setLineWidth(.5);
      doc.line(xs,y+5,xs,y+32);
      doc.text(sv,xs+3,y+12);
      doc.line(xs,y+14.5,xs+3+Math.max(wv,9)+2,y+14.5);
      if(withSol){doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]);doc.text(String(it.r),xs+3,y+23);ink()}
    }else{
      doc.setFontSize(16);doc.setFont('helvetica','bold');
      var top=it.a,bot=it.b;
      if(it.op==='*'&&top<bot){top=it.b;bot=it.a}
      var wm=Math.max(sw(top),sw(bot),sw(it.r));
      var xr=x+cw-8,xl2=xr-wm-7;
      doc.text(String(top),xr,y+11,{align:'right'});
      doc.text(String(bot),xr,y+19,{align:'right'});
      doc.setTextColor(RED[0],RED[1],RED[2]);drawOp(doc,it.op,xl2,y+19,RED);ink();
      doc.setDrawColor(INK[0],INK[1],INK[2]);doc.setLineWidth(.5);doc.line(xl2,y+21,xr,y+21);
      if(withSol){doc.setTextColor(BLUE[0],BLUE[1],BLUE[2]);doc.text(String(it.r),xr,y+29,{align:'right'});ink()}
    }
  });

  var d=new Date(),p=function(n){return (n<10?'0':'')+n};
  var name='mates-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-nivel'+P.level+(withSol?'-soluciones':'')+'.pdf';
  doc.save(name);
}
$('#pdfBtn').onclick=function(){pdf(false)};
$('#pdfSolBtn').onclick=function(){pdf(true)};

/* ─── tema (comparte la preferencia del hub) ─── */
var CYCLE=['auto','light','dark'];
function applyTheme(t){
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('dash:theme',t)}catch(e){}
  $('#themeBtn').textContent=t==='dark'?'\u263E':t==='light'?'\u2600':'\u25D0';
  $('#themeBtn').title='Tema: '+t;
}
$('#themeBtn').onclick=function(){
  var cur='auto';try{cur=localStorage.getItem('dash:theme')||'auto'}catch(e){}
  applyTheme(CYCLE[(CYCLE.indexOf(cur)+1)%3]);
};
(function(){var t='auto';try{t=localStorage.getItem('dash:theme')||'auto'}catch(e){}applyTheme(t)})();

refresh();
})();
</script>
