<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="españa">
<meta name="robots" content="noindex, nofollow">
<title>Atlas de España</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563EB'/><path d='M22 30l22-8 24 6 12 14-8 24-20 12-24-8z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('dash:theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{
  --paper:#F7F6F3;--card:#FFFFFF;--chip:#F0EEE9;--line:#E2DED6;--line-s:#C8C3BA;
  --ink:#1A1916;--muted:#6B6760;--faint:#9B9690;
  --blue:#2563EB;--blue-soft:#EFF4FF;--blue-line:#BFCFFF;
  --red:#DC2626;--ok:#16A34A;--bad:#DC2626;--on-accent:#FFFFFF;
  --c0:#D9E6F7;--c1:#F6E0D0;--c2:#DAEED6;--c3:#E8DEF3;--land:#E9E6DF;--ctx:#ECEAE4;--sea:transparent;
  --r:10px;--rs:6px;
  --txt:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141412;--card:#1E1D1A;--chip:#252320;--line:#2E2C28;--line-s:#3E3B36;--ink:#F0EDE8;--muted:#A09C94;--faint:#6B6760;
  --blue:#4F83F7;--blue-soft:#0F1E3D;--blue-line:#1E3A7A;--red:#F87171;--ok:#4ADE80;--bad:#F87171;--on-accent:#0B1220;
  --c0:#27384F;--c1:#4A372B;--c2:#2B4332;--c3:#3F3350;--land:#2A2825;--ctx:#222120;}}
:root[data-theme="dark"]{
  --paper:#141412;--card:#1E1D1A;--chip:#252320;--line:#2E2C28;--line-s:#3E3B36;--ink:#F0EDE8;--muted:#A09C94;--faint:#6B6760;
  --blue:#4F83F7;--blue-soft:#0F1E3D;--blue-line:#1E3A7A;--red:#F87171;--ok:#4ADE80;--bad:#F87171;--on-accent:#0B1220;
  --c0:#27384F;--c1:#4A372B;--c2:#2B4332;--c3:#3F3350;--land:#2A2825;--ctx:#222120;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--txt);min-height:100vh}
button,select,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.hdr{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px}
.back{display:inline-flex;align-items:center;padding:4px 8px;font-size:13px;color:var(--faint);text-decoration:none;border:1px solid var(--line);border-radius:var(--rs);flex-shrink:0}
.back:hover{color:var(--ink);background:var(--chip)}
@media(max-width:560px){.back .bt{display:none}}
.hdr h1{font:600 20px/1.2 var(--num);letter-spacing:.01em;white-space:nowrap}
.sp{flex:1}
.tbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--rs);background:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tbtn:hover{background:var(--chip);color:var(--ink)}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:var(--rs);background:var(--chip);flex-shrink:0}
.seg button{padding:5px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);font:500 13px var(--txt);cursor:pointer;white-space:nowrap}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--line)}
.seg.scope button{padding:5px 14px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:var(--rs);font:500 13px var(--txt);cursor:pointer}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.primary:hover{background:var(--blue);opacity:.92}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:10px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.glabel{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.sel{border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:6px 10px;font:500 13px var(--txt);max-width:200px}
.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:13px;color:var(--muted)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .track{width:28px;height:16px;border-radius:99px;background:var(--line-s);position:relative;transition:background .15s}
.tog .track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked+.track{background:var(--blue)}
.tog input:checked+.track::after{transform:translateX(12px)}
.tog input:focus-visible+.track{outline:2px solid var(--blue);outline-offset:2px}
.tog:has(input:checked){color:var(--ink)}
.famslot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
body.playing #bar2{display:none}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.main.playing{grid-template-columns:1fr}
.main.playing>div:first-child{display:flex;flex-direction:column}
.main.playing .gbar{order:-1;margin:0 0 10px}
.main.playing #svg{max-height:calc(100vh - 360px);min-height:260px}
.main.playing .hint{display:none}
.main.playing .side{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.mapwrap{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);touch-action:none}
#svg{display:block;width:100%;height:auto;max-height:calc(100vh - 230px);min-height:300px;aspect-ratio:var(--ar,1.17);cursor:grab;user-select:none;-webkit-user-select:none}
#svg.drag{cursor:grabbing}
.land path,.land circle{vector-effect:non-scaling-stroke}
.land path{fill:var(--f,var(--land));stroke:var(--card);stroke-width:.8px;stroke-linejoin:round;cursor:pointer;transition:fill .12s}
.nocol .land path{--f:var(--land)}
.land path.hov{fill:color-mix(in srgb,var(--f,var(--land)) 62%,var(--blue))}
.land path.sel{stroke:var(--blue);stroke-width:2.2px}
.land path.dim{opacity:.32;pointer-events:none}
.land path.ok{fill:color-mix(in srgb,var(--f,var(--land)) 30%,var(--ok))}
.land path.bad{fill:color-mix(in srgb,var(--f,var(--land)) 30%,var(--bad))}
.land path.tgt{fill:color-mix(in srgb,var(--f,var(--land)) 45%,var(--blue));stroke:var(--blue);stroke-width:2.4px}
.land path.tgt.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.ctx path{fill:var(--ctx);stroke:var(--card);stroke-width:.6px;vector-effect:non-scaling-stroke;pointer-events:none}
.brd{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.insf{fill:none;stroke:var(--line-s);stroke-width:1px;vector-effect:non-scaling-stroke;pointer-events:none}
.ring{fill:color-mix(in srgb,var(--blue) 8%,transparent);stroke:var(--blue);stroke-width:1.3px;stroke-dasharray:3 2;cursor:pointer;vector-effect:non-scaling-stroke}
.ring.hov{fill:color-mix(in srgb,var(--blue) 30%,transparent)}
.ring.ok{stroke:var(--ok);fill:color-mix(in srgb,var(--ok) 30%,transparent)}
.ring.bad{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 30%,transparent)}
.ring.tgt{stroke-width:2.4px;fill:color-mix(in srgb,var(--blue) 35%,transparent)}
.lbl{font-family:var(--txt);font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-linejoin:round;stroke-opacity:.9}
.lbl.sel{font-weight:600}
.geo{font-family:var(--txt);font-size:12px;letter-spacing:.14em;text-transform:uppercase;fill:var(--faint);text-anchor:middle;pointer-events:none}
.cap{fill:var(--ink);stroke:var(--card);stroke-width:1.2px;vector-effect:non-scaling-stroke;pointer-events:none}
.capt{font-family:var(--txt);font-style:italic;fill:var(--muted);dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-linejoin:round}
.zb{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zb button{width:30px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);font-size:17px;line-height:1;cursor:pointer;color:var(--muted)}
.zb button:hover{background:var(--chip);color:var(--ink)}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--paper);padding:5px 9px;border-radius:var(--rs);font-size:12.5px;line-height:1.35;max-width:240px}
.tip small{display:block;opacity:.7;font-size:11.5px}
.side{padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 150px);min-height:280px}
@media(max-width:900px){.side{max-height:none}}
.sidehead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidehead .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{font:600 14px var(--txt)}
.sidehead input[type=search]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--rs);padding:7px 10px;font:500 14px var(--txt)}
.sidehead input:focus{outline:none;border-color:var(--blue)}
.ficha{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--blue-soft)}
.ficha h3{font:600 20px/1.2 var(--num)}
.ficha .sub{font-size:13px;color:var(--muted)}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-size:13px}
.ficha dt{color:var(--faint)}
.ficha .kids{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ficha .kids button{border:1px solid var(--blue-line);background:var(--card);border-radius:4px;padding:1px 7px;font-size:12px;cursor:pointer}
.tbl{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--card);text-align:left;font:600 11px var(--txt);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:6px 12px;border-bottom:1px solid var(--line)}
tr.r{cursor:pointer}
tr.r:hover,tr.r.hov{background:var(--chip)}
tr.r.sel{background:var(--blue-soft)}
td .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;background:var(--f)}
.cover td.cv{filter:blur(6px);transition:filter .15s}
.cover tr.show td.cv{filter:none}
.muted{color:var(--muted)}
/* game */
.setup{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.setup h3{font:600 16px var(--txt)}
.modes{display:grid;gap:8px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.mode:hover{border-color:var(--line-s)}
.mode b{display:block;font:600 16px var(--num)}
.mode small{color:var(--muted);font-size:12.5px}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.rowf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.gbar{margin-top:10px;padding:12px 14px}
.gtop{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.gtop .grow{flex:1}
.pbar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
.gq{font:600 22px/1.25 var(--num);margin:4px 0 10px}
.gq b{color:var(--blue)}
.gtype{display:flex;gap:8px}
.gtype input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:var(--rs);padding:9px 11px;font:500 16px var(--txt)}
.gtype input:focus{outline:none;border-color:var(--blue)}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.gopts{grid-template-columns:1fr}}
.gopt{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px;font:600 17px var(--num);cursor:pointer;text-align:left}
.gopt:hover:not(:disabled){border-color:var(--line-s);background:var(--chip)}
.gopt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.gopt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.gfb{min-height:26px;margin-top:8px;font:600 17px var(--num)}
.gfb.ok{color:var(--ok)}.gfb.bad{color:var(--bad)}
.gact{display:flex;gap:8px;margin-top:8px}
.end{padding:4px 0}
.end .big{font:700 52px/1 var(--num)}
.end .stats{display:flex;gap:22px;margin:8px 0;color:var(--muted);font-size:13px}
.end .stats b{display:block;color:var(--ink);font:700 22px var(--num)}
.misses{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.misses li{border:1px solid var(--line);background:var(--chip);border-radius:var(--rs);padding:3px 10px;font:600 15px var(--num)}
/* progress modal */
.po{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pom{width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.pom h3{font:600 18px var(--num);display:flex;justify-content:space-between;align-items:center}
.pom h4{font:600 11px var(--txt);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.pom ul{list-style:none;font-size:13.5px}
.pom li{padding:3px 0}
.po-row{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.po-bar{height:8px;border-radius:4px;background:var(--chip);border:1px solid var(--line);display:flex;overflow:hidden}
.po-bar i{display:block;height:100%}
.l3{background:var(--ok)}.l2{background:#E2B24A}.l1{background:var(--bad)}
.po-c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.po-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.po-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
html .fam-card{border-radius:var(--r);padding:18px}
html .fam-card h2{font:600 18px var(--num)}
html .fam-card input{border-radius:var(--rs);font:500 16px var(--txt)}
html .fam-btn{font:500 14px var(--txt);background:var(--card);border-radius:var(--rs);padding:8px 14px}
html .fam-btn.p{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
html .fam-btn.g{background:transparent}
html .fam-prof{font:600 17px var(--num);border:1px solid var(--line);border-radius:var(--r)}
html .fam-av{border-radius:6px;font-weight:600}
html .fam-chip{border-radius:var(--rs);padding:2px 10px 2px 3px;font:600 13px var(--txt)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <a class="back" href="../">‹<span class="bt"> dashboards</span></a>
  <h1>España</h1>
  <div class="seg scope" id="scope" role="group" aria-label="Zona"></div>
  <span class="sp"></span>
  <button class="tbtn" id="themeBtn" aria-label="Cambiar tema" title="Tema">◐</button>
</div></header>

<div class="wrap">
  <div class="bar">
    <div class="famslot" id="famSlot"></div>
    <span class="sp"></span>
    <button class="btn primary" id="playBtn">Jugar</button>
  </div>
  <div class="bar" id="bar2">
    <div class="grp"><span class="glabel">Capa</span><div class="seg" id="layers" role="group"></div></div>
    <div class="grp" id="zoneGrp"><span class="glabel" id="zoneLbl">Zona</span><select class="sel" id="zone" aria-label="Zona"></select></div>
    <div class="grp">
      <label class="tog"><input type="checkbox" id="tNames" checked><span class="track"></span>Nombres</label>
      <label class="tog"><input type="checkbox" id="tCaps" checked><span class="track"></span>Capitales</label>
      <label class="tog"><input type="checkbox" id="tColors" checked><span class="track"></span>Colores</label>
    </div>
  </div>

  <div class="main" id="main">
    <div>
      <div class="mapwrap" id="mapwrap">
        <svg id="svg" role="img" aria-label="Mapa de España"></svg>
        <div class="zb"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zreset" aria-label="Restablecer vista" style="font-size:12px">⌂</button></div>
      </div>
      <div class="hint" id="hint">Arrastra para mover · rueda o pellizco para acercar · toca una zona para ver su ficha</div>
      <div class="card gbar" id="gbar" hidden></div>
    </div>

    <aside class="card side" id="side">
      <div id="study" style="display:flex;flex-direction:column;min-height:0;flex:1">
        <div class="sidehead">
          <div class="row"><span class="count" id="count"></span>
            <label class="tog"><input type="checkbox" id="tCover"><span class="track"></span>Tapar respuestas</label></div>
          <input type="search" id="q" placeholder="Buscar…" autocomplete="off">
        </div>
        <div class="ficha" id="ficha" hidden></div>
        <div class="tbl"><table><thead><tr><th data-s="n" id="th1">Nombre</th><th data-s="c" id="th2">Capital</th><th data-s="p" id="th3"></th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
      <div class="setup" id="setup" hidden></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="po" id="po" hidden><div class="pom"><h3><span id="poTitle"></span><button class="tbtn" id="poClose" aria-label="Cerrar">✕</button></h3><div id="poBody"></div></div></div>

<script src="../shared/profiles.js"></script>

  $("gskip").hidden=true;
  const go=$("gok");if(go)go.disabled=true;const gi=$("gin");if(gi)gi.disabled=true;
  document.querySelectorAll("#gopts .gopt").forEach(b=>{b.disabled=true;if(isCorrectChoice(it,b.dataset.o))b.classList.add("ok")});
  renderLabels();applyGameMarks();
  const nx=$("gnext");nx.hidden=false;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(ok){G._auto=setTimeout(()=>{if(G.active&&G.cur===it)advance()},1000)}
  // zoom helps when the target is small
  const t=fitTo(it.bb,.9);if(!ok&&G.mode==="loc"){if(T.k<t.k*.9&&it.L!=="ca"){}}}
function advance(){clearTimeout(G._auto);G.i++;nextQ()}
$("gbar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="gnext")advance();
  else if(b.id==="gskip"){judge(false,null)}
  else if(b.id==="gok")submit();
  else if(b.classList.contains("gopt")&&!G.locked){const v=b.dataset.o;const ok=isCorrectChoice(G.cur,v);if(!ok)b.classList.add("bad");judge(ok,null)}
  else if(b.id==="gagain"){startGame()}
  else if(b.id==="gretry"){const miss=G.miss.slice();G.pool=miss;startGame()}
  else if(b.id==="gquit")exitGame()});
function submit(){if(G.locked)return;const v=($("gin").value||"").trim();if(!v){$("gin").focus();return}judge(isCorrectTyped(G.cur,v),null)}
function gameClick(id){if(G.mode!=="loc"||G.locked||!G.cur)return;const it=G.cur;judge(id===it.id,id)}
document.addEventListener("keydown",e=>{if(G.active&&G.locked&&G.cur&&(e.key==="Enter"||e.key===" ")&&e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON"&&!e.repeat){e.preventDefault();advance()}
  if(e.key==="Escape"){if(!$("po").hidden)$("po").hidden=true;else if(S.mode!=="study")exitGame()}});
function endGame(){
  G.locked=true;G.tgt=null;G.reveal=null;G.mark={};G.miss.forEach(m=>G.mark[m.id]="bad");const secs=Math.round((Date.now()-G.t0)/1000);G.endState={answered:G.answered,secs};progSession();
  refreshStyles();applyGameMarks();renderLabels();
  const pct=G.answered?Math.round(G.score/G.answered*100):0;
  $("gbar").innerHTML=`<div class="end"><div class="big">${G.score}/${G.answered}</div><div class="stats"><span><b>${pct}%</b>aciertos</span><span><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b>tiempo</span></div>
  ${G.miss.length?`<div class="glabel" style="margin-top:6px">Para repasar</div><ul class="misses">${G.miss.map(m=>`<li>${esc(m.n)}</li>`).join("")}</ul>`:`<div class="gfb ok">¡Sin fallos!</div>`}
  <div class="gact">${G.miss.length?`<button class="btn primary" id="gretry">Repetir fallos</button>`:""}<button class="btn${G.miss.length?"":" primary"}" id="gagain">Otra vez</button><button class="btn" id="gquit">Salir</button></div></div>`}
// ---------- progress
const PD={v:1,facts:{},sessions:[],prefs:{}};
let PDref=PD;
function progDefaults(){return {v:1,facts:{},sessions:[],prefs:{}}}
function progNormalize(s){const d=progDefaults();if(s&&typeof s==="object"){d.facts=s.facts||{};d.sessions=Array.isArray(s.sessions)?s.sessions:[];d.prefs=s.prefs||{}}return d}
function progMerge(r,l){const o=progNormalize(r),x=progNormalize(l);for(const k of Object.keys(x.facts)){const a=o.facts[k],b=x.facts[k];if(!a||(b.c+b.w)>=(a.c+a.w))o.facts[k]=b}
  const seen=new Set(o.sessions.map(s=>s.t));x.sessions.forEach(s=>{if(!seen.has(s.t))o.sessions.push(s)});o.sessions.sort((a,b)=>b.t-a.t);o.sessions=o.sessions.slice(0,40);o.prefs=x.prefs;return o}
const progOn=()=>!!(window.FamProfiles&&FamProfiles.current());
function progRecord(it,mode,ok){if(!progOn())return;const f=PDref.facts[it.id]||(PDref.facts[it.id]={c:0,w:0,last:null,t:0,m:{}});const m=f.m[mode]||(f.m[mode]=[0,0]);
  if(ok){f.c++;m[0]++}else{f.w++;m[1]++}f.last=ok?1:0;f.t=Date.now();FamProfiles.save(PDref)}
function progSession(){if(!progOn()||!G.endState||!G.endState.answered)return;PDref.sessions.unshift({t:Date.now(),mode:G.mode,layer:S.layer,scope:S.scope,score:G.score,answered:G.endState.answered,secs:G.endState.secs});PDref.sessions=PDref.sessions.slice(0,40);FamProfiles.save(PDref);FamProfiles.flush()}
const lvl=f=>!f||f.c+f.w===0?0:f.last===0?1:(f.c>=3&&f.c>=2*f.w)?3:2;
const progBtn=document.createElement("button");progBtn.className="btn";progBtn.textContent="Mi progreso";
progBtn.onclick=()=>{progRender();$("po").hidden=false};
$("poClose").onclick=()=>{$("po").hidden=true};$("po").addEventListener("click",e=>{if(e.target===$("po"))$("po").hidden=true});
function progRender(){const who=progOn()?FamProfiles.current():null;const name=who&&who!=="guest"?who.name:"";
  $("poTitle").textContent="Mi progreso"+(name?" · "+name:"");
  const row=(label,list)=>{const c=[0,0,0,0];list.forEach(d=>c[lvl(PDref.facts[d.id])]++);const n=list.length||1,w=i=>(c[i]/n*100).toFixed(1)+"%";
    return `<div class="po-row"><span>${esc(label)}</span><div class="po-bar"><i class="l3" style="width:${w(3)}"></i><i class="l2" style="width:${w(2)}"></i><i class="l1" style="width:${w(1)}"></i></div><span class="po-c">${c[3]}/${list.length}</span></div>`};
  let h="";if(who==="guest"||!who)h+=`<p class="muted" style="font-size:13px;margin-top:8px">Estás jugando sin perfil: el progreso no se guarda.</p>`;
  h+=row("Comunidades",D.layers.ca)+row("Provincias",D.layers.pr)+row("Concellos",D.layers.co);
  h+=`<div class="po-leg"><span><i class="l3"></i>Dominado</span><span><i class="l2"></i>Va bien</span><span><i class="l1"></i>Fallado</span><span><i style="background:var(--chip);border:1px solid var(--line)"></i>Sin probar</span></div>`;
  const weak=Object.keys(PDref.facts).filter(id=>byId[id]&&lvl(PDref.facts[id])===1).map(id=>byId[id]).sort((a,b)=>{const fa=PDref.facts[a.id],fb=PDref.facts[b.id];return (fb.w-fb.c)-(fa.w-fa.c)||fb.t-fa.t});
  h+=`<h4>Para repasar${weak.length?` (${weak.length})`:""}</h4>`;
  h+=weak.length?`<ul>${weak.slice(0,14).map(d=>`<li>${esc(d.n)} <span class="muted">· ${esc(NAMES[d.L][0])}</span></li>`).join("")}</ul><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${["ca","pr","co"].filter(L=>weak.some(d=>d.L===L)).map(L=>`<button class="btn primary" data-pr="${L}">Practicar ${NAMES[L][1]} (${weak.filter(d=>d.L===L).length})</button>`).join("")}</div>`:`<div class="muted" style="font-size:13px">Nada que repasar por ahora.</div>`;
  h+=`<h4>Últimas partidas</h4>`;
  const ML={loc:"Localizar",name:"Nombre",cap:"Capitales",par:"Comunidad",par2:"Provincia"};
  h+=PDref.sessions.length?`<ul>${PDref.sessions.slice(0,8).map(s=>`<li>${esc(new Date(s.t).toLocaleDateString("es",{day:"numeric",month:"short"}))} · ${esc(LAYER_LABEL[s.layer]||"")} · ${esc(ML[s.mode]||s.mode)} · <b>${s.score}/${s.answered}</b> · ${Math.floor(s.secs/60)}:${String(s.secs%60).padStart(2,"0")}</li>`).join("")}</ul>`:`<div class="muted" style="font-size:13px">Aún no hay partidas.</div>`;
  $("poBody").innerHTML=h;
  $("poBody").querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const L=b.dataset.pr;$("po").hidden=true;if(S.mode!=="study")exitGame(true);
    const sc=L==="co"?"gl":"es";if(S.scope!==sc)setScope(sc);if(S.layer!==L)setLayer(L);
    const ids=new Set(weak.filter(d=>d.L===L).map(d=>d.id));openSetup(layerItems(L).filter(d=>ids.has(d.id)))})}
// ---------- boot
const ro=new ResizeObserver(()=>{measure();scheduleLabels()});ro.observe(svg);
buildScope();document.title=S.scope==="gl"?"Atlas de Galicia":"Atlas de España";document.querySelector(".hdr h1").textContent=S.scope==="gl"?"Galicia":"España";
rebuild();goHome(0);
window.addEventListener("hashchange",()=>{const sc=/galicia|gl/i.test(location.hash)?"gl":"es";if(sc!==S.scope)setScope(sc)});
if(window.FamProfiles){
  FamProfiles.init({app:"espana",lang:()=>"es",defaults:progDefaults,normalize:progNormalize,merge:progMerge,
    onLoad:d=>{PDref=d},onData:d=>{PDref=d}});
  const slot=$("famSlot");slot.appendChild(FamProfiles.chip());slot.appendChild(progBtn);slot.appendChild(FamProfiles.syncEl());
}else{$("famSlot").appendChild(progBtn)}
</script>
</body>
