function pad(n){return String(n).padStart(2,"0")}
function clockStr(t){t=((t%720)+720)%720;return (Math.floor(t/60)||12)+":"+pad(t%60)}
function fmt(t){
  t=((t%1440)+1440)%1440;
  if(S.fmt==="24")return pad(Math.floor(t/60))+":"+pad(t%60);
  return clockStr(t)+(S.lang==="en"?(t<720?" am":" pm"):"");
}
function period(t){
  var d=((t%1440)+1440)%1440;
  if(S.lang==="en"){
    if(d===720)return {icon:"",label:"Noon",suf:""};
    if(d===0)return {icon:"",label:"Midnight",suf:""};
    if(d>=300&&d<720)return {icon:"",label:"In the morning",suf:" in the morning"};
    if(d>720&&d<1080)return {icon:"",label:"In the afternoon",suf:" in the afternoon"};
    if(d>=1080&&d<1260)return {icon:"",label:"In the evening",suf:" in the evening"};
    return {icon:"",label:"At night",suf:" at night"};
  }
  if(d===720)return {icon:"",label:"Mediodía",suf:" del mediodía"};
  if(d===0)return {icon:"",label:"Medianoche",suf:" de la noche"};
  if(d>=360&&d<720)return {icon:"",label:"Por la mañana",suf:" de la mañana"};
  if(d>720&&d<1200)return {icon:"",label:"Por la tarde",suf:" de la tarde"};
  return {icon:"",label:"Por la noche",suf:" de la noche"};
}
function hourPhrase(n){return n===1?"la una":"las "+W[n]}
function minWord(m){
  if(m===15)return "cuarto";
  if(m===30)return "media";
  if(m===1)return "un minuto";
  return m%5===0?W[m]:W[m]+" minutos";
}
var EW=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty","twenty-one","twenty-two","twenty-three","twenty-four","twenty-five","twenty-six","twenty-seven","twenty-eight","twenty-nine"];
function minWordEn(m){
  if(m===15)return "a quarter";
  if(m===30)return "half";
  if(m===1)return "one minute";
  return m%5===0?EW[m]:EW[m]+" minutes";
}
function phraseEn(u){
  var b=u%720, h=Math.floor(b/60)||12, m=b%60, nh=h%12+1, suf=period(u).suf;
  if(u===720)return "It’s twelve noon";
  if(u===0)return "It’s twelve midnight";
  if(m===0)return "It’s "+EW[h]+" o’clock"+suf;
  if(m<=30)return "It’s "+minWordEn(m)+" past "+EW[h]+suf;
  return "It’s "+minWordEn(60-m)+" to "+EW[nh]+suf;
}
function phrase(t){
  if(S.lang==="en")return phraseEn(((t%1440)+1440)%1440);
  var u=((t%1440)+1440)%1440, b=u%720, h=Math.floor(b/60)||12, m=b%60, nh=h%12+1, suf=period(u).suf;
  var verb=function(n){return n===1?"Es":"Son"};
  if(m===0)return verb(h)+" "+hourPhrase(h)+" en punto"+suf;
  if(m<=30)return verb(h)+" "+hourPhrase(h)+" y "+minWord(m)+suf;
  return verb(nh)+" "+hourPhrase(nh)+" menos "+minWord(60-m)+suf;
}
function randTime(level){
  var h=1+Math.floor(Math.random()*12), m;
  if(level===1)m=0;
  else if(level===2)m=pick([0,30]);
  else if(level===3)m=pick([0,15,30,45]);
  else if(level===4)m=5*Math.floor(Math.random()*12);
  else m=Math.floor(Math.random()*60);
  return (h%12)*60+m+(Math.random()<0.5?720:0);
}
function validMinute(m,level){
  if(level===1)return m===0;
  if(level===2)return m===0||m===30;
  if(level===3)return m%15===0;
  if(level===4)return m%5===0;
  return true;
}
function distractors(t,level){
  var b=t%720, half=t-b, h=Math.floor(b/60), m=b%60, out=[], seen={};
  seen[fmt(t)]=1;
  var cand=[
    (Math.floor(m/5)%12)*60+(h*5)%60,
    ((h+1)%12)*60+m, ((h+11)%12)*60+m,
    h*60+(m+30)%60, h*60+(m+15)%60, h*60+(m+45)%60,
    h*60+(m+5)%60, h*60+(m+55)%60,
    ((h+1)%12)*60+(m+30)%60
  ];
  var list=shuffle(cand).map(function(c){return c+(S.fmt==="24"&&Math.random()<0.4?(half?0:720):half)});
  if(S.fmt==="24")list.unshift((half?0:720)+b);
  var take=function(c){
    var k=fmt(c);
    if(out.length<3&&c!==t&&!seen[k]&&validMinute(c%60,level)){seen[k]=1;out.push(c)}
  };
  list.forEach(take);
  var guard=0;
  while(out.length<3&&guard++<400)take(randTime(level));
  return out;
}

function faceSVG(o){
  o=o||{};
  var total=o.total||0, live=!!o.interactive, s="", i, a, x, y;
  s+='<svg class="clock'+(live?' live':'')+'" viewBox="0 0 200 200" role="img" aria-label="Reloj de agujas"'+(live?' tabindex="0"':'')+'>';
  s+='<circle cx="100" cy="100" r="97" fill="var(--rim)"/><circle cx="100" cy="100" r="93" fill="var(--face)"/>';
  for(i=0;i<60;i++){
    var major=i%5===0; a=i*6*Math.PI/180;
    var r1=91, r2=major?83:87;
    s+='<line x1="'+(100+r1*Math.sin(a)).toFixed(2)+'" y1="'+(100-r1*Math.cos(a)).toFixed(2)+'" x2="'+(100+r2*Math.sin(a)).toFixed(2)+'" y2="'+(100-r2*Math.cos(a)).toFixed(2)+'" stroke="var(--tick)" stroke-width="'+(major?2.4:1)+'" stroke-linecap="round"/>';
  }
  for(i=1;i<=12;i++){
    a=i*30*Math.PI/180;
    x=100+62*Math.sin(a); y=100-62*Math.cos(a);
    s+='<text x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="var(--ink)">'+i+'</text>';
    x=100+76*Math.sin(a); y=100-76*Math.cos(a);
    s+='<text class="mlabel" x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="600" fill="var(--muted)">'+(i*5)+'</text>';
  }
  s+='<g class="hh" transform="rotate('+(total*0.5)+' 100 100)"><line x1="100" y1="110" x2="100" y2="58" stroke="var(--hour)" stroke-width="7" stroke-linecap="round"/></g>';
  s+='<g class="mh" transform="rotate('+((total%60)*6)+' 100 100)"><line x1="100" y1="114" x2="100" y2="20" stroke="var(--minute)" stroke-width="4.5" stroke-linecap="round"/>'+(live?'<circle cx="100" cy="21" r="7" fill="var(--minute)" stroke="var(--card)" stroke-width="2"/>':'')+'</g>';
  s+='<circle cx="100" cy="100" r="6" fill="var(--ink)"/></svg>';
  return s;
}
function liveClock(host,o){
  var svg=$("svg",host), hh=$(".hh",svg), mh=$(".mh",svg);
  var api={total:o.total||0,snap:o.snap||5};
  function draw(){
    hh.setAttribute("transform","rotate("+(api.total*0.5)+" 100 100)");
    mh.setAttribute("transform","rotate("+((api.total%60)*6)+" 100 100)");
  }
  api.set=function(t){
    api.total=((Math.round(t)%720)+720)%720;
    draw();
    if(o.onChange)o.onChange(api.total);
  };
  function fromMinute(m){
    var H=Math.floor(api.total/60), pm=api.total%60;
    if(pm>=45&&m<15)H++;
    else if(pm<15&&m>=45)H--;
    api.set(H*60+m);
  }
  function handle(e){
    var r=svg.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    if(Math.hypot(dx,dy)<r.width*0.06)return;
    var ang=Math.atan2(dx,-dy)*180/Math.PI;
    if(ang<0)ang+=360;
    var m=Math.round(ang/6/api.snap)*api.snap;
    if(m>=60)m=0;
    if(m!==api.total%60)fromMinute(m);
  }
  var drag=false;
  svg.addEventListener("pointerdown",function(e){
    drag=true;
    try{svg.setPointerCapture(e.pointerId)}catch(x){}
    handle(e); e.preventDefault();
  });
  svg.addEventListener("pointermove",function(e){if(drag)handle(e)});
  var end=function(){drag=false};
  svg.addEventListener("pointerup",end);
  svg.addEventListener("pointercancel",end);
  svg.addEventListener("keydown",function(e){
    var d=0,k=e.key;
    if(k==="ArrowRight"||k==="ArrowUp")d=api.snap;
    else if(k==="ArrowLeft"||k==="ArrowDown")d=-api.snap;
    else if(k==="PageUp")d=60;
    else if(k==="PageDown")d=-60;
    if(d){e.preventDefault();api.set(api.total+d)}
  });
  return api;
}

    '<div class="conv">'+conv+'</div>'+
  '</div>';
  var host=$("#host"), api, half=1;
  function upd(t){
    var D=t+half*720;
    $("#dig").textContent=fmt(D);
    $("#phr").textContent=phrase(D);
    var pr=period(D); $("#per").textContent=pr.label;
    $("#am").setAttribute("aria-pressed",String(half===0));
    $("#pm").setAttribute("aria-pressed",String(half===1));
    var sv=$("svg",host); if(sv)sv.setAttribute("aria-label",T("Reloj")+": "+phrase(D));
  }
  $("#am").onclick=function(){half=0;upd(api.total)};
  $("#pm").onclick=function(){half=1;upd(api.total)};
  host.innerHTML=faceSVG({total:180,interactive:true});
  api=liveClock(host,{total:180,snap:5,onChange:upd});
  upd(180);
  view.querySelectorAll("[data-m]").forEach(function(b){
    b.onclick=function(){api.set(Math.floor(api.total/60)*60+Number(b.dataset.m))};
  });
  var sp=$("#sp");
  if(!("speechSynthesis" in window))sp.hidden=true;
  sp.onclick=function(){speak(phrase(api.total+half*720))};
  var cb=$("#mins"); cb.checked=!!S.help;
  cb.onchange=function(){S.help=cb.checked;save();applyHelp()};
}

/* ---------- ¿Qué hora es? y Contrarreloj ---------- */
function quiz(timed){
  var N=10, n=0, ok=0, cur=-1, locked=false, left=60, timer=null, to=null, done=false;
  view.innerHTML=
  '<div class="card">'+
    '<div class="stat"><span id="s1"></span><span id="s2"></span></div>'+
    '<div class="progress"><i id="pg"></i></div>'+
    '<div class="clock-wrap" id="host"></div>'+
    '<div class="period" id="per"></div>'+
    '<div class="phrase" id="phr" aria-live="polite">&nbsp;</div>'+
    '<div class="opts" id="opts"></div>'+
    '<div class="msg" id="msg" aria-live="polite"></div>'+
  '</div>';
  var card=view.firstElementChild;
  cleanup=function(){clearInterval(timer);clearTimeout(to)};
  function hud(){
    $("#s1").textContent=timed?"⏱️ "+left+" s":T("Pregunta {a} de {b}",{a:Math.min(n+1,N),b:N});
    $("#s2").textContent=T("Aciertos {a}",{a:ok});
    $("#pg").style.width=((timed?left/60:n/N)*100)+"%";
  }
  function next(){
    if(done)return;
    if(!timed&&n>=N)return finish();
    locked=false;
    var t; do{t=randTime(S.level)}while(t===cur);
    cur=t;
    $("#host").innerHTML=faceSVG({total:cur});
    var pr=period(cur); $("#per").textContent=pr.label;
    $("#phr").innerHTML="&nbsp;"; $("#msg").textContent="";
    var o=shuffle([cur].concat(distractors(cur,S.level)));
    $("#opts").innerHTML=o.map(function(t){return '<button class="opt" type="button" data-t="'+t+'">'+fmt(t)+'</button>'}).join("");
    hud();
  }
  $("#opts").onclick=function(e){
    var b=e.target.closest(".opt");
    if(!b||locked||done)return;
    locked=true;
    var t=Number(b.dataset.t), good=(t===cur);
    n++;
    $("#phr").textContent=phrase(cur);
    if(good){
      ok++; S.stars++; b.classList.add("ok"); beep([660,880]);
      $("#msg").textContent=pick([T("¡Correcto!"),T("¡Muy bien!"),T("¡Eso es!"),T("¡Genial!")]);
    }else{
      b.classList.add("bad");
      Array.prototype.forEach.call($("#opts").children,function(x){if(Number(x.dataset.t)===cur)x.classList.add("ok")});
      beep([240,180]);
      $("#msg").textContent=T("¡Casi! Mira la solución.");
    }
    save(); hudStars(); hud();
    to=setTimeout(next,good?(timed?450:1300):(timed?900:2500));
  };
  function finish(){
    done=true; clearInterval(timer); clearTimeout(to);
    var k="t"+S.level, isNew=false;
    if(timed&&ok>0&&ok>(S.best[k]||0)){S.best[k]=ok;isNew=true}
    save();
    var lvl=timed?(ok>=10?3:ok>=6?2:ok>=3?1:0):(ok>=9?3:ok>=7?2:ok>=4?1:0);
    var title=[T("¡A seguir practicando!"),T("¡Vas bien!"),T("¡Muy bien!"),T("¡Increíble!")][lvl];
    var canUp=ok>=8&&S.level<5;
    card.innerHTML=
      '<div class="result"><h2>'+title+'</h2>'+
      '<p class="sum">'+(timed?T("{a} correctas en 60 segundos",{a:ok}):T("{a} de {b} bien",{a:ok,b:N}))+'. '+T("Has ganado {a} ⭐",{a:ok})+'</p>'+
      (timed?'<p class="sum">'+T("Récord en el nivel {a}:",{a:S.level})+' <b>'+(S.best[k]||0)+'</b>'+(isNew?' · '+T("¡Nuevo récord!"):'')+'</p>':'')+
      '<div class="row"><button class="btn" type="button" id="again">'+T("Jugar otra vez")+'</button>'+
      (canUp?'<button class="btn alt" type="button" id="up">'+T("Subir al nivel {a}",{a:S.level+1})+'</button>':'')+'</div></div>';
    $("#again").onclick=function(){quiz(timed)};
    var up=$("#up");
    if(up)up.onclick=function(){S.level++;save();renderLevels();go(mode)};
    if(lvl>=2)confetti();
  }
  if(timed){
    timer=setInterval(function(){
      left--;
      if(left<=0){left=0;finish()}else hud();
    },1000);
  }
  next();
}

/* ---------- Pon la hora ---------- */
function setGame(){
  var N=8, n=0, firstTry=0, target=-1, fails=0, api=null, state="check", done=false;
  view.innerHTML=
  '<div class="card">'+
    '<div class="stat"><span id="s1"></span><span id="s2"></span></div>'+
    '<div class="progress"><i id="pg"></i></div>'+
    '<div class="ask">'+T("Pon esta hora en el reloj")+'</div>'+
    '<div class="lcd" id="dig"></div>'+
    '<div class="phrase" id="phr"></div>'+
    '<div class="clock-wrap" id="host"></div>'+
    '<div class="row"><button class="btn alt" type="button" id="hm">'+T("− 1 hora")+'</button><button class="btn alt" type="button" id="hp">'+T("+ 1 hora")+'</button></div>'+
    '<div class="row"><button class="btn" type="button" id="go">'+T("Comprobar")+'</button></div>'+
    '<div class="msg" id="msg" aria-live="polite"></div>'+
    '<p class="hint">'+T("Arrastra la punta de la aguja azul. La roja la acompaña.")+'</p>'+
  '</div>';
  var card=view.firstElementChild;
  function hud(){
    $("#s1").textContent=T("Reto {a} de {b}",{a:Math.min(n+1,N),b:N});
    $("#s2").textContent="⭐ "+firstTry;
    $("#pg").style.width=((n+(state==="next"?1:0))/N*100)+"%";
  }
  function round(){
    var t; do{t=randTime(S.level)}while(t===target);
    target=t;
    var snap=S.level===5?1:5, s;
    do{s=Math.floor(Math.random()*12)*60+(S.level===5?Math.floor(Math.random()*60):5*Math.floor(Math.random()*12))}while(s===target%720);
    fails=0; state="check";
    $("#dig").textContent=fmt(target);
    $("#phr").textContent=phrase(target);
    $("#msg").textContent="";
    $("#go").textContent=T("Comprobar");
    $("#host").innerHTML=faceSVG({total:s,interactive:true});
    api=liveClock($("#host"),{total:s,snap:snap});
    hud();
  }
  $("#hm").onclick=function(){api.set(api.total-60)};
  $("#hp").onclick=function(){api.set(api.total+60)};
  function toNext(){
    state="next";
    $("#go").textContent=(n===N-1)?T("Ver resultado →"):T("Siguiente →");
    hud();
  }
  $("#go").onclick=function(){
    if(done)return;
    if(state==="next"){n++;if(n>=N)return finish();return round()}
    if(api.total===target%720){
      if(fails===0){firstTry++;S.stars++;save();hudStars()}
      beep([660,880]);
      $("#msg").textContent=fails===0?T("¡Perfecto!"):T("¡Bien! Lo has conseguido.");
      toNext();
    }else{
      fails++; beep([240,180]);
      if(fails>=2){
        api.set(target);
        $("#msg").textContent=T("Así se pone: {a}.",{a:phrase(target)});
        toNext();
      }else{
        var sameHour=Math.floor(api.total/60)===Math.floor((target%720)/60);
        $("#msg").textContent=sameHour?T("La hora está bien, pero revisa los minutos (aguja azul)."):T("Ahora marca {a}. ¡Inténtalo otra vez!",{a:clockStr(api.total)});
      }
    }
  };
  function finish(){
    done=true;
    var lvl=firstTry>=7?3:firstTry>=5?2:firstTry>=3?1:0;
    var title=[T("¡A seguir practicando!"),T("¡Vas bien!"),T("¡Muy bien!"),T("¡Increíble!")][lvl];
    card.innerHTML=
      '<div class="result"><h2>'+title+'</h2>'+
      '<p class="sum">'+T("{a} de {b} a la primera. Has ganado {a} ⭐",{a:firstTry,b:N})+'</p>'+
      '<div class="row"><button class="btn" type="button" id="again">'+T("Jugar otra vez")+'</button>'+
      (firstTry>=6&&S.level<5?'<button class="btn alt" type="button" id="up">'+T("Subir al nivel {a}",{a:S.level+1})+'</button>':'')+'</div></div>';
    $("#again").onclick=setGame;
    var up=$("#up");
    if(up)up.onclick=function(){S.level++;save();renderLevels();go(mode)};
    if(lvl>=2)confetti();
  }
  round();
}

/* ---------- Memoria ---------- */
function memory(){
  var set={}, times=[];
  while(times.length<6){var t=randTime(S.level);if(!set[t%720]){set[t%720]=1;times.push(t)}}
  var cards=[];
  times.forEach(function(t){cards.push({t:t,k:"c"});cards.push({t:t,k:"d"})});
  cards=shuffle(cards);
  view.innerHTML=
  '<div class="card">'+
    '<div class="stat"><span id="s1">'+T("Intentos: {a}",{a:0})+'</span><span id="s2">'+T("Parejas: {a} de 6",{a:0})+'</span></div>'+
    '<p class="hint" style="margin:0 0 8px">'+T("Une cada reloj con su hora.")+'</p>'+
    '<div class="mem" id="grid">'+cards.map(function(c){
      return '<button class="mcard" type="button" data-t="'+c.t+'" aria-label="'+T("Carta")+'"><span class="in"><span class="mback">?</span><span class="mfront">'+(c.k==="c"?faceSVG({total:c.t}):'<b>'+fmt(c.t)+'</b><small>'+period(c.t).icon+'</small>')+'</span></span></button>';
    }).join("")+'</div>'+
    '<div class="result" id="res" hidden></div>'+
  '</div>';
  var first=null, lock=false, moves=0, pairs=0, to=null;
  cleanup=function(){clearTimeout(to)};
  $("#grid").onclick=function(e){
    var c=e.target.closest(".mcard");
    if(!c||lock||c.classList.contains("flip"))return;
    c.classList.add("flip");
    if(!first){first=c;return}
    moves++;
    var a=first, b=c; first=null;
    $("#s1").textContent=T("Intentos: {a}",{a:moves});
    if(a.dataset.t===b.dataset.t){
      a.classList.add("done"); b.classList.add("done"); pairs++;
      beep([660,880]);
      $("#s2").textContent=T("Parejas: {a} de 6",{a:pairs});
      if(pairs===6)win();
    }else{
      lock=true; beep([240]);
      to=setTimeout(function(){a.classList.remove("flip");b.classList.remove("flip");lock=false},1000);
    }
  };
  function win(){
    var st=moves<=8?3:moves<=12?2:1;
    S.stars+=st;
    var k="m"+S.level, isNew=false;
    if(!S.best[k]||moves<S.best[k]){S.best[k]=moves;isNew=true}
    save(); hudStars();
    var res=$("#res");
    res.hidden=false;
    res.innerHTML=
      '<h2>'+T("¡Todas las parejas!")+'</h2>'+
      '<p class="sum">'+T("{a} intentos. Has ganado {b} ⭐",{a:moves,b:st})+'</p>'+
      '<p class="sum">'+T("Mejor marca en el nivel {a}:",{a:S.level})+' <b>'+S.best[k]+'</b>'+(isNew?' · '+T("¡Nueva!"):'')+'</p>'+
      '<div class="row"><button class="btn" type="button" id="again">'+T("Jugar otra vez")+'</button></div>';
    $("#again").onclick=memory;
    confetti();
  }
}

/* ---------- Inicio ---------- */
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("dash:theme",t)}catch(e){}
  var b=$("#themeBtn"); b.textContent=t==="dark"?"☾":t==="light"?"☀":"◐"; b.title=T("Tema")+": "+t;
}
$("#themeBtn").onclick=function(){
  var cur="auto"; try{cur=localStorage.getItem("dash:theme")||"auto"}catch(e){}
  applyTheme({auto:"light",light:"dark",dark:"auto"}[cur]||"auto");
};
(function(){var t="auto";try{t=localStorage.getItem("dash:theme")||"auto"}catch(e){}applyTheme(t)})();
hudStars(); applyLang(); applyHelp(); renderTabs(); renderLevels();
if(window.FamProfiles){
  window.FamProfiles.init({
    app:"reloj",
    lang:function(){return S.lang==="en"?"en":"es"},
    defaults:function(){return norm({})},
    normalize:norm,
    merge:mergeData,
    onLoad:function(d){S=d;hudStars();applyLang();applyHelp();go("learn");window.scrollTo(0,0)},
    onData:function(d){S=d;hudStars();applyLang()}
  });
  $("#slot").appendChild(window.FamProfiles.chip());
  $("#sync").appendChild(window.FamProfiles.syncEl());
}else{
  go("learn");
}
})();
</script>
