<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iago">
<meta name="robots" content="noindex, nofollow">
<title>Juegos de Iago</title>

<script>(function(){try{var t=localStorage.getItem('dash:theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --paper:#F7F6F3;--card:#FFFFFF;--chip:#F0EEE9;--line:#E2DED6;--line-s:#C8C3BA;
  --ink:#1A1916;--muted:#6B6760;--faint:#9B9690;
  --blue:#2563EB;--blue-soft:#EFF4FF;--blue-line:#BFCFFF;
  --red:#DC2626;--ok:#16A34A;--bad:#DC2626;--warn:#D97706;
  --chip-on:#1A1916;--chip-on-ink:#F7F6F3;--on-accent:#FFFFFF;--btn-ink:#FFFFFF;--shadow:none;
  --r:10px;--rs:6px;--w:640px;
  --txt:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --gold:#D97706;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141412;--card:#1E1D1A;--chip:#252320;--line:#2E2C28;--line-s:#3E3B36;--ink:#F0EDE8;--muted:#A09C94;--faint:#6B6760;--blue:#4F83F7;--blue-soft:#0F1E3D;--blue-line:#1E3A7A;--red:#F87171;--ok:#4ADE80;--bad:#F87171;--warn:#FCD34D;--chip-on:#F0EDE8;--chip-on-ink:#141412;--on-accent:#0B1220;--btn-ink:#0B1220;--gold:#FCD34D;}}
:root[data-theme="dark"]{--paper:#141412;--card:#1E1D1A;--chip:#252320;--line:#2E2C28;--line-s:#3E3B36;--ink:#F0EDE8;--muted:#A09C94;--faint:#6B6760;--blue:#4F83F7;--blue-soft:#0F1E3D;--blue-line:#1E3A7A;--red:#F87171;--ok:#4ADE80;--bad:#F87171;--warn:#FCD34D;--chip-on:#F0EDE8;--chip-on-ink:#141412;--on-accent:#0B1220;--btn-ink:#0B1220;--gold:#FCD34D;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; color:var(--ink); font:16px/1.45 var(--txt); min-height:100vh;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.app{max-width:640px;margin:0 auto;padding:12px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{color:var(--muted);text-decoration:none;font-size:14px;padding:4px 8px;margin-left:-8px;border-radius:8px}
h1{font:700 clamp(26px,6vw,34px)/1.1 Georgia,'Times New Roman',serif;margin:0;flex:1 1 auto}
button{font:inherit;color:inherit;cursor:pointer}
.ib{border:2px solid var(--line);background:var(--card);border-radius:14px;min-width:48px;height:48px;font-size:24px;display:grid;place-items:center;padding:0 10px}
.stars{font:700 20px var(--num);background:var(--card);border:2px solid var(--line);border-radius:14px;height:48px;padding:0 12px;display:flex;align-items:center;gap:4px}
[hidden]{display:none!important}

/* menú */
.game-btn{display:flex;align-items:center;gap:18px;width:100%;padding:18px 20px;border:3px solid var(--line);background:var(--card);border-radius:24px;font:700 clamp(24px,7vw,32px) var(--num);margin-bottom:14px;box-shadow:var(--shadow);text-align:left}
.game-btn .e{font-size:clamp(46px,13vw,64px);line-height:1}
.game-btn small{display:block;font:500 14px var(--txt);color:var(--muted);margin-top:2px}
.game-btn:active{transform:scale(.98)}
.g1{border-color:#d6403b}.g2{border-color:#1f4fd1}.g3{border-color:#1f8a4c}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:22px}
.card h2{font:700 15px var(--num);margin:0 0 4px;color:var(--muted)}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.set .lb{min-width:120px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.note{font-size:12px;color:var(--muted);margin-top:12px}

/* juego */
.dots{display:flex;justify-content:center;gap:10px;margin:2px 0 10px}
.dots i{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;font-size:16px}
.dots i.on{border-color:var(--gold);background:#fff6d6}
.prompt{font:700 clamp(24px,7vw,34px)/1.15 var(--num);text-align:center;margin:6px 0 14px}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:18px;min-height:150px;align-content:flex-start}
.it{position:relative;font-size:clamp(40px,12vw,62px);line-height:1;background:var(--card);border:3px solid var(--line);border-radius:20px;width:clamp(66px,18vw,88px);height:clamp(66px,18vw,88px);display:grid;place-items:center;padding:0}
.it.on{background:var(--blue-soft);border-color:var(--blue);transform:scale(.9)}
.it.on::after{content:attr(data-n);position:absolute;right:-6px;top:-8px;background:var(--blue);color:var(--on-accent);font:700 16px var(--num);width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:24px;font:700 clamp(44px,14vw,76px)/1 var(--num);padding:20px 0;box-shadow:var(--shadow)}
.opt:active{transform:scale(.96)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.no{animation:wig .4s}
.opts.done .opt:not(.ok){opacity:.35}
@keyframes wig{20%{transform:translateX(-10px) rotate(-3deg)}60%{transform:translateX(10px) rotate(3deg)}}
.pic{font-size:clamp(100px,32vw,160px);line-height:1.05;text-align:center;margin:0}
.word{font:700 clamp(34px,10vw,48px) var(--num);text-align:center;margin:0 0 18px;letter-spacing:.04em;min-height:1.2em}
.word b{color:var(--red)}
.say-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}

/* globos */
.sky{position:relative;height:62vh;min-height:360px;overflow:hidden;border-radius:20px;background:linear-gradient(#cfe6ff,#eaf4ff);border:3px solid var(--line)}
.balloon{position:absolute;bottom:-150px;width:80px;animation:rise linear infinite;border:0;background:none;padding:0}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-1 * var(--h) - 260px))}}
.bb{display:grid;place-items:center;width:80px;height:98px;border-radius:50% 50% 48% 48%;color:#fff;font:700 44px var(--num);box-shadow:inset -8px -8px 0 rgba(0,0,0,.12),0 6px 12px -6px rgba(0,0,0,.4);position:relative}
.bb::after{content:"";position:absolute;left:50%;bottom:-26px;width:2px;height:26px;background:rgba(0,0,0,.35)}
.bb.wig{animation:wig .4s}
.bb.pop{animation:pop .45s forwards}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(1.9);opacity:0}}
.target{position:absolute;left:0;right:0;top:8px;text-align:center;z-index:3;pointer-events:none}
.target span{display:inline-block;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:4px 18px;font:700 clamp(26px,7vw,36px) var(--num);box-shadow:var(--shadow)}
.target b{color:var(--red);font-size:1.3em}

/* fin */
.end{text-align:center;padding-top:30px}
.end .big{font-size:clamp(46px,14vw,70px);letter-spacing:.05em}
.end h2{font:700 clamp(30px,9vw,44px) var(--num);margin:10px 0 24px}
.end .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.end .game-btn{width:auto;justify-content:center;margin:0;padding:14px 26px;font-size:24px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-40px;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.balloon{animation-duration:60s!important}}

/* ═══ restyle: rfl-ops-dash language (flat neutrals, Barlow, 1px borders, no paper/shadows) ═══ */
html{padding-top:0;-webkit-text-size-adjust:100%}
body{background:var(--paper);background-image:none;color:var(--ink);font:15px/1.5 var(--txt)}
.app{max-width:var(--w);margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px));min-height:0}
.app::before{display:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header.hdr{position:sticky;top:0;z-index:10;display:block;margin:0;padding:env(safe-area-inset-top,0px) 0 0;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px}
.hdr .back{display:inline-flex;align-items:center;margin:0;padding:4px 8px;font-size:13px;color:var(--faint);text-decoration:none;border:1px solid var(--line);border-radius:var(--rs);flex-shrink:0;white-space:nowrap}
.hdr .back:hover{color:var(--ink);background:var(--chip)}
@media(max-width:480px){.hdr .back .bt{display:none}}
.hdr h1{flex:1;min-width:0;margin:0;font:600 20px/1.2 var(--num);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .theme{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:var(--rs);background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.hdr .theme:hover{background:var(--chip);color:var(--ink)}
.who-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:var(--rs);padding:2px 10px 2px 3px;cursor:pointer;font:600 13px var(--txt);color:var(--ink);flex-shrink:0}
.who-chip:hover{background:var(--chip)}
.av{border-radius:6px;font:600 15px var(--num)}
.who-chip .av{width:24px;height:24px;font-size:13px}
.sync{font-size:12px;color:var(--faint);margin:-4px 0 10px;min-height:16px}
.sync.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:none}
.card h2{font:600 14px/1.3 var(--txt);margin:0 0 10px;color:var(--ink)}
.hint{color:var(--muted);font-size:13px}
.label{font-size:13px;color:var(--muted)}
.tabs{display:flex;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;gap:2px;margin:0 0 14px;padding:3px;background:var(--chip);border:1px solid var(--line);border-radius:var(--rs)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);font:500 13px var(--txt);white-space:nowrap;cursor:pointer}
.tab:hover:not([aria-selected="true"]){color:var(--ink)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);border-color:var(--line)}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:var(--rs);overflow:visible;background:var(--chip)}
.seg button{padding:5px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);font:500 13px var(--txt)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:var(--rs);font:500 14px var(--txt);cursor:pointer;transition:background .12s}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.primary:hover{background:var(--blue);opacity:.92}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{font-size:13px;color:var(--muted)}
.field input,.row input[type=text]{border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;background:var(--paper);color:var(--ink);font:500 16px var(--txt)}
.field input:focus,.row input[type=text]:focus{outline:none;border-color:var(--blue)}
.cerr{font-size:13px;color:var(--bad)}
.prof{border:1px solid var(--line);border-radius:var(--r);background:var(--card);font:600 17px var(--num)}
.prof:hover{border-color:var(--line-s)}
.prof .x{font:500 12px var(--txt)}
.foot button{color:var(--faint)}
.foot button:hover{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hdr-in{height:60px}
.hdr h1{font:600 22px/1.2 var(--num)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:var(--rs);min-width:40px;width:40px;height:40px;padding:0;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:hover{background:var(--chip);color:var(--ink)}
.ib[hidden]{display:none}
.stars{font:600 16px var(--num);background:var(--card);border:1px solid var(--line);border-radius:var(--rs);height:40px;padding:0 12px;gap:6px;flex-shrink:0}
.stars svg{color:var(--gold)}
.game-btn{--c:var(--blue);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;gap:16px;box-shadow:none;font:600 clamp(22px,6vw,28px) var(--num);margin-bottom:10px}
.game-btn:hover{border-color:var(--line-s)}
.game-btn .e{display:grid;place-items:center;flex-shrink:0;width:clamp(56px,16vw,72px);height:clamp(56px,16vw,72px);border-radius:var(--r);background:color-mix(in srgb,var(--c) 11%,var(--card));font-size:clamp(30px,9vw,40px)}
.game-btn small{font:400 14px var(--txt);color:var(--muted)}
.g1{--c:var(--red);border-color:var(--line)}
.g2{--c:var(--blue);border-color:var(--line)}
.g3{--c:var(--ok);border-color:var(--line)}
.card{margin-top:18px;padding:14px 16px}
.card h2{font:600 11px var(--txt);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.set{font-size:14px}
.dots i{width:22px;height:22px;border:2px solid var(--line);font-size:13px}
.dots i.on{border-color:var(--blue);background:var(--blue-soft)}
.prompt{font:600 clamp(24px,7vw,32px)/1.2 var(--num)}
.it{border:1px solid var(--line);border-radius:var(--r)}
.it.on{border-color:var(--blue);background:var(--blue-soft);transform:scale(.94)}
.it.on::after{font:600 15px var(--num);color:var(--on-accent)}
.opt{border:1px solid var(--line);border-radius:var(--r);box-shadow:none;font:600 clamp(44px,14vw,72px)/1 var(--num);padding:18px 0}
.opt:hover{border-color:var(--line-s)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.word{font:600 clamp(34px,10vw,46px) var(--num)}
.sky{background:var(--blue-soft);border:1px solid var(--line);border-radius:var(--r)}
.bb{box-shadow:none;font:600 40px var(--num);color:#fff}
.target span{border:1px solid var(--line);border-radius:var(--rs);box-shadow:none;font:600 clamp(24px,6vw,32px) var(--num)}
.end h2{font:600 clamp(28px,8vw,40px) var(--num)}
.end .game-btn{border-radius:var(--r);padding:12px 24px;font-size:22px}
.end .game-btn.g1{background:var(--card);color:var(--ink)}
.end .game-btn.g2{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
</style>
</head>

<header class="hdr"><div class="hdr-in">
    <a class="back" id="hubLink" href="../">‹<span class="bt"> dashboards</span></a>
    <button class="ib" id="menuBtn" aria-label="Menú" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 7.5L8 2.5l6 5M3.5 6.5V13h3.5V9.5h2V13h3.5V6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  </div></header>
<div class="app">

  <!-- MENÚ -->
  <section id="v-menu">
    <button class="game-btn g1" data-game="1"><span class="e">🍎</span><span>Cuenta y toca<small>Contar del 1 al 10</small></span></button>
    <button class="game-btn g2" data-game="2"><span class="e">🔤</span><span>¿Con qué letra?<small>Letras y dibujos</small></span></button>
    <button class="game-btn g3" data-game="3"><span class="e">🎈</span><span>Globos<small>Toca la letra o el número</small></span></button>

    <div class="card">
      <h2>Para mamá y papá</h2>
      <div class="set"><span class="lb">Números hasta</span><div class="seg" data-pref="max"><button data-v="5">5</button><button data-v="10">10</button></div></div>

    </div>
  </section>

    <div class="row">
      <button class="game-btn g2" id="againBtn">Otra vez</button>
      <button class="game-btn g1" id="endMenuBtn">Menú</button>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function h(tag,attrs,html){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}if(html!=null)e.innerHTML=html;return e}

var NAME='Iago',ROUND=5;
var WORDS=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
var LN={A:'a',B:'be',C:'ce',D:'de',E:'e',F:'efe',G:'ge',I:'i',L:'ele',M:'eme',N:'ene',O:'o',P:'pe',R:'erre',S:'ese',T:'te',U:'u',V:'uve'};
var PICS=[
 ['A','avi\u00F3n','\u2708\uFE0F'],['A','\u00E1rbol','\uD83C\uDF33'],['B','barco','\u26F5'],['B','ballena','\uD83D\uDC33'],
 ['C','casa','\uD83C\uDFE0'],['C','caballo','\uD83D\uDC34'],['D','diente','\uD83E\uDDB7'],['D','dado','\uD83C\uDFB2'],
 ['E','elefante','\uD83D\uDC18'],['F','flor','\uD83C\uDF38'],['F','foca','\uD83E\uDDAD'],
 ['G','gato','\uD83D\uDC31'],['G','globo','\uD83C\uDF88'],['I','isla','\uD83C\uDFDD\uFE0F'],['I','iguana','\uD83E\uDD8E'],
 ['L','luna','\uD83C\uDF19'],['L','le\u00F3n','\uD83E\uDD81'],['M','mano','\u270B'],['M','mariposa','\uD83E\uDD8B'],
 ['N','nube','\u2601\uFE0F'],['N','naranja','\uD83C\uDF4A'],['O','oso','\uD83D\uDC3B'],['O','ojo','\uD83D\uDC41\uFE0F'],
 ['P','perro','\uD83D\uDC36'],['P','pato','\uD83E\uDD86'],['R','rat\u00F3n','\uD83D\uDC2D'],['R','rana','\uD83D\uDC38'],
 ['S','sol','\u2600\uFE0F'],['S','serpiente','\uD83D\uDC0D'],['T','tren','\uD83D\uDE82'],['T','tortuga','\uD83D\uDC22'],
 ['U','uvas','\uD83C\uDF47'],['U','unicornio','\uD83E\uDD84'],['V','vaca','\uD83D\uDC2E'],['V','volc\u00E1n','\uD83C\uDF0B']
];
var ITEMS=['\uD83C\uDF4E','\uD83D\uDC36','\uD83D\uDC31','\uD83D\uDE97','\uD83C\uDF1F','\uD83D\uDC1F','\uD83E\uDD86','\uD83C\uDF4C','\uD83D\uDC38','\uD83C\uDF88','\uD83E\uDD8B','\uD83C\uDF53'];
var COLORS=['#d6403b','#1f4fd1','#1f8a4c','#c27a0e','#7a4fd1','#0e8fa8'];

/* ─── ajustes y estrellas (solo en este dispositivo) ─── */
var PREF={max:5,letters:'name',balloons:'letters',sound:1};
var stars=0;
try{var sv=JSON.parse(localStorage.getItem('iago:prefs')||'null');if(sv)for(var k in PREF)if(sv[k]!==undefined)PREF[k]=sv[k];stars=parseInt(localStorage.getItem('iago:stars')||'0',10)||0}catch(e){}
function savePref(){try{localStorage.setItem('iago:prefs',JSON.stringify(PREF))}catch(e){}}
function setStars(n){stars=n;$('#starN').textContent=n;try{localStorage.setItem('iago:stars',String(n))}catch(e){}}
setStars(stars);
function syncPrefs(){$$('[data-pref]').forEach(function(sg){var k=sg.dataset.pref;sg.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(String(PREF[k])===b.dataset.v))})})}
$$('[data-pref] button').forEach(function(b){b.onclick=function(){
  var k=b.parentNode.dataset.pref,v=b.dataset.v;
  PREF[k]=(k==='max'||k==='sound')?parseInt(v,10):v;savePref();syncPrefs();
  if(k==='sound'&&!PREF.sound&&window.speechSynthesis)speechSynthesis.cancel();
}});
syncPrefs();

/* ─── voz y sonidos ─── */
var voice=null,lastSay='';
function pickVoice(){
  if(!window.speechSynthesis)return;
  var vs=speechSynthesis.getVoices()||[];
  voice=vs.filter(function(v){return /^es[-_]ES/i.test(v.lang)})[0]||vs.filter(function(v){return /^es/i.test(v.lang)})[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,remember){
  if(remember!==false)lastSay=text;
  if(!PREF.sound||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:'es-ES';if(voice)u.voice=voice;
    u.rate=.85;u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
var AC=null;
function tone(f,t0,d,type,vol){
  if(!PREF.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,AC.currentTime+t0);
    g.gain.linearRampToValueAtTime(vol||.15,AC.currentTime+t0+.02);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+d);
    o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05);
  }catch(e){}
}
function sfx(k){
  if(k==='ok'){tone(523,0,.18);tone(659,.12,.18);tone(784,.24,.3)}
  else if(k==='pop'){tone(420,0,.12,'square',.1);tone(240,.05,.15,'square',.08)}
  else if(k==='tick'){tone(880,0,.08,'triangle',.12)}
  else if(k==='no'){tone(220,0,.18,'triangle',.1)}
  else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,i*.13,.3)})}
}
$('#sayBtn').onclick=function(){say(lastSay)};

function confetti(n){
  var box=$('#confetti'),em=['\u2B50','\uD83C\uDF89','\uD83C\uDF88','\u2728','\uD83C\uDF1F'];
  for(var i=0;i<(n||26);i++){
    var s=h('span',{text:pick(em)});
    s.style.left=R(0,95)+'%';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.6)+'s';
    box.appendChild(s);
    (function(s){setTimeout(function(){s.remove()},4800)})(s);
  }
}

/* ─── navegación ─── */
var game=0,done=0,busy=false,timer=null;
function view(v){
  ['menu','play','end'].forEach(function(n){$('#v-'+n).hidden=(n!==v)});
  $('#menuBtn').hidden=(v==='menu');$('#hubLink').hidden=(v!=='menu');
  $('#sayBtn').hidden=(v!=='play');
  window.scrollTo(0,0);
}
function toMenu(){clearTimeout(timer);if(window.speechSynthesis)speechSynthesis.cancel();game=0;view('menu')}
$('#menuBtn').onclick=toMenu;$('#endMenuBtn').onclick=toMenu;
$('#againBtn').onclick=function(){start(game)};
$$('.game-btn[data-game]').forEach(function(b){b.onclick=function(){start(parseInt(b.dataset.game,10))}});
function dots(){
  var d=$('#dots');d.innerHTML='';
  for(var i=0;i<ROUND;i++){var e=h('i',{'class':i<done?'on':''},i<done?'\u2B50':'');d.appendChild(e)}
}
function start(g){game=g;done=0;busy=false;clearTimeout(timer);view('play');dots();next()}
function next(){
  busy=false;
  if(game===1)g1();else if(game===2)g2();else if(game===3)g3();
}
function correct(){
  busy=true;sfx('ok');setStars(stars+1);done++;dots();
  if(done>=ROUND)timer=setTimeout(finish,1700);else timer=setTimeout(next,1800);
}
function finish(){
  view('end');sfx('win');confetti(40);
  say('\u00A1Muy bien, '+NAME+'! \u00A1Has ganado cinco estrellas!',false);
}

/* ─── juego 1: cuenta y toca ─── */
function g1(){
  var max=PREF.max,n=R(1,max),em=pick(ITEMS),counted=0,st=$('#stage');
  st.innerHTML='<div class="prompt">\u00BFCu\u00E1ntos hay?</div><div class="items" id="items"></div><div class="opts" id="opts"></div><div class="say-hint">Toca cada dibujo para contar</div>';
  var items=$('#items');
  for(var i=0;i<n;i++){
    var b=h('button',{'class':'it','aria-label':em},em);
    b.onclick=function(){
      if(this.classList.contains('on')||busy)return;
      counted++;this.classList.add('on');this.setAttribute('data-n',counted);
      sfx('tick');say(WORDS[counted],false);
    };
    items.appendChild(b);
  }
  var opts=[n],pool=[];
  for(var v=1;v<=max;v++)if(v!==n)pool.push(v);
  shuffle(pool).slice(0,2).forEach(function(v){opts.push(v)});
  shuffle(opts).forEach(function(v){
    var b=h('button',{'class':'opt','aria-label':WORDS[v]},String(v));
    b.onclick=function(){
      if(busy)return;
      if(v===n){
        b.classList.add('ok');$('#opts').classList.add('done');
        say('\u00A1Muy bien! Hay '+WORDS[n]+'.',false);correct();
      }else{
        b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx('no');
        say('Cuenta otra vez. \u00A1T\u00FA puedes!',false);
      }
    };
    $('#opts').appendChild(b);
  });
  say('\u00BFCu\u00E1ntos hay? Toca cada dibujo para contarlos.');
}

/* ─── juego 2: ¿con qué letra empieza? ─── */
var lastWord='';
function letterPool(){return PREF.letters==='name'?['I','A','G','O']:Object.keys(LN)}
function g2(){
  var pool=letterPool();
  var cands=PICS.filter(function(p){return pool.indexOf(p[0])>=0&&p[1]!==lastWord});
  var p=pick(cands),L=p[0],word=p[1];lastWord=word;
  var st=$('#stage');
  st.innerHTML='<div class="pic">'+p[2]+'</div><div class="word" id="word">'+word+'</div><div class="opts" id="opts"></div>';
  var opts=[L];
  shuffle(pool.filter(function(x){return x!==L})).slice(0,2).forEach(function(x){opts.push(x)});
  shuffle(opts).forEach(function(l){
    var b=h('button',{'class':'opt','aria-label':LN[l]},l);
    b.onclick=function(){
      if(busy)return;
      if(l===L){
        b.classList.add('ok');$('#opts').classList.add('done');
        $('#word').innerHTML='<b>'+word.charAt(0)+'</b>'+word.slice(1);
        say(word+' empieza por la '+LN[L]+'. \u00A1Muy bien!',false);correct();
      }else{
        b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx('no');
        say('Esa es la '+LN[l]+'. \u00A1Prueba otra vez!',false);
      }
    };
    $('#opts').appendChild(b);
  });
  say('\u00BFCon qu\u00E9 letra empieza '+word+'?');
}

/* ─── juego 3: globos ─── */
function g3(){
  var nums=PREF.balloons==='numbers';
  var pool=nums?(function(){var a=[];for(var i=1;i<=PREF.max;i++)a.push(String(i));return a})():letterPool();
  var st=$('#stage');
  var count=Math.min(st.clientWidth<430?4:5,pool.length);
  var labels=shuffle(pool).slice(0,count),target=pick(labels);
  st.innerHTML='<div class="sky" id="sky"><div class="target"><span>Toca '+(nums?'el':'la')+' <b>'+target+'</b></span></div></div>';
  var sky=$('#sky'),H=sky.clientHeight||420;
  sky.style.setProperty('--h',H+'px');
  var cols=shuffle(COLORS);
  labels.forEach(function(lb,i){
    var b=h('button',{'class':'balloon','aria-label':nums?WORDS[parseInt(lb,10)]:LN[lb]});
    var left=2+i*(94/count)+R(0,2);
    b.style.left=left+'%';
    b.style.animationDuration=R(11,16)+'s';
    b.style.animationDelay='-'+(i*(13/count)+Math.random()*2).toFixed(1)+'s';
    var bb=h('span',{'class':'bb',text:lb});bb.style.background=cols[i%cols.length];
    b.appendChild(bb);
    b.onclick=function(){
      if(busy)return;
      if(lb===target){
        bb.classList.add('pop');sfx('pop');
        say('\u00A1Muy bien!',false);correct();
      }else{
        bb.classList.remove('wig');void bb.offsetWidth;bb.classList.add('wig');sfx('no');
        say((nums?'Ese es el ':'Esa es la ')+(nums?WORDS[parseInt(lb,10)]:LN[lb])+'. Busca '+(nums?'el ':'la ')+(nums?WORDS[parseInt(target,10)]:LN[target])+'.',false);
      }
    };
    sky.appendChild(b);
  });
  say('Toca '+(nums?'el n\u00FAmero ':'la letra ')+(nums?WORDS[parseInt(target,10)]:LN[target]));
}

/* ─── tema (comparte la preferencia del hub) ─── */
var CYCLE=['auto','light','dark'];
function applyTheme(t){
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('dash:theme',t)}catch(e){}
  $('#themeBtn').textContent=t==='dark'?'\u263E':t==='light'?'\u2600':'\u25D0';
}
$('#themeBtn').onclick=function(){
  var cur='auto';try{cur=localStorage.getItem('dash:theme')||'auto'}catch(e){}
  applyTheme(CYCLE[(CYCLE.indexOf(cur)+1)%3]);
};
(function(){var t='auto';try{t=localStorage.getItem('dash:theme')||'auto'}catch(e){}applyTheme(t)})();
view('menu');
})();
</script>
